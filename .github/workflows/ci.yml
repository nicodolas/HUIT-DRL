name: HUIT DRL Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & E2E Playwright Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Install Playwright Browsers
        if: env.DATABASE_URL != ''
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        if: env.DATABASE_URL != ''
        run: npx playwright test tests/e2e/theme-system.spec.ts tests/e2e/admin-portal.spec.ts tests/e2e/student-utilities-dropdown.spec.ts tests/e2e/login-footer-author.spec.ts tests/e2e/admin-semester-lifecycle.spec.ts tests/e2e/header-layout.spec.ts tests/e2e/check-username-security.spec.ts tests/e2e/security.spec.ts --project=chromium

      - name: Restore Clean Database State
        if: always() && env.DATABASE_URL != ''
        run: node scripts/cleanup-db.js

      - name: Upload Playwright Test Report (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
